<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#5b5fef" />

    <!-- Self-hosted (see src/styles/global.css for the @font-face) rather
         than loaded from Google Fonts — removes the extra DNS+TLS handshake
         to a third-party origin that was previously on the critical path.
         Measured both with and without this preload: removing it made FCP
         worse (2.0s -> 1.7s with it) with no LCP benefit, so it stays. -->
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="/fonts/inter-latin.woff2"
      crossorigin
    />

    <title>Virtual Classroom | Live Online Classes, Whiteboard &amp; Quizzes</title>
    <meta
      name="description"
      content="Virtual Classroom is a live online teaching platform — video classes, a real-time collaborative whiteboard, quizzes, attendance, and assignments in one place for teachers and students."
    />
    <!-- TODO: replace virtualclassroom.app below with the real production
         domain once one is chosen — canonical/OG/Twitter URLs are placeholders. -->
    <link rel="canonical" href="https://virtualclassroom.app/" />

    <!-- Open Graph (Facebook, WhatsApp, LinkedIn, Slack link previews) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Virtual Classroom" />
    <meta
      property="og:title"
      content="Virtual Classroom | Live Online Classes, Whiteboard &amp; Quizzes"
    />
    <meta
      property="og:description"
      content="Live video classes, a real-time collaborative whiteboard, quizzes, attendance, and assignments — one platform for teachers and students."
    />
    <meta property="og:image" content="https://virtualclassroom.app/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="620" />
    <meta property="og:image:height" content="403" />
    <meta property="og:image:alt" content="Virtual Classroom — live video, whiteboard, quizzes and attendance in one platform" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:url" content="https://virtualclassroom.app/" />

    <!-- Twitter / X card. Note: Twitter does not render SVG images, so this
         must stay a raster (PNG/JPG) file — see og-image.png below. -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="Virtual Classroom | Live Online Classes, Whiteboard &amp; Quizzes"
    />
    <meta
      name="twitter:description"
      content="Live video classes, a real-time collaborative whiteboard, quizzes, attendance, and assignments — one platform for teachers and students."
    />
    <meta name="twitter:image" content="https://virtualclassroom.app/og-image.png" />
    <meta name="twitter:image:alt" content="Virtual Classroom — live video, whiteboard, quizzes and attendance in one platform" />

    <!-- Structured data: helps search engines understand what the site is
         and enables sitelinks search box / rich result eligibility. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Virtual Classroom",
        "url": "https://virtualclassroom.app/",
        "description": "Virtual Classroom is a live online teaching platform — video classes, a real-time collaborative whiteboard, quizzes, attendance, and assignments in one place for teachers and students."
      }
    </script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "EducationalOrganization",
        "name": "Virtual Classroom",
        "url": "https://virtualclassroom.app/",
        "logo": "https://virtualclassroom.app/favicon.svg"
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
