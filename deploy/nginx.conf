server {
    listen 80;
    server_name YOUR_DOMAIN_OR_DUCKDNS_NAME;

    # Allow large uploads for recorded lectures and class materials
    client_max_body_size 100M;

    # Proxy all traffic to the Node.js / Socket.IO server on port 8000
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;

        # WebSocket support (Required for Socket.IO & WebRTC signaling)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Standard proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Keep-alive timeout for live classroom WebSockets
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_connect_timeout 60s;
    }
}
